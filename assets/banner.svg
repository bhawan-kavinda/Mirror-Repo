<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="bt bd" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="bt">mirror-hub</title>
  <desc id="bd">mirror-hub mirrors the GitHub repositories you choose to GitLab on a schedule you control. Repo cards on the left are reflected through a glass mirror to the right.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="0.55" stop-color="#121238"/>
      <stop offset="1" stop-color="#2a1236"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.12" cy="0.2" r="0.55">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.9" cy="0.85" r="0.5">
      <stop offset="0" stop-color="#fb923c" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.55" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#fdba74"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cardL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="cardR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#fb923c" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fb923c" stop-opacity="0.06"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="round"><rect width="1280" height="400" rx="26"/></clipPath>
    <clipPath id="mirrorClip"><rect x="950" y="52" width="20" height="262" rx="10"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <style>
    .sans { font-family: 'Segoe UI', Inter, system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .sweep { animation: slide 4.5s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateY(-140px); } 100% { transform: translateY(330px); } }
    .pulse { animation: pulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .sweep, .pulse { animation: none; } }
  </style>

  <g clip-path="url(#round)">
    <!-- background -->
    <rect width="1280" height="400" fill="url(#bg)"/>
    <rect width="1280" height="400" fill="url(#dots)"/>
    <rect width="1280" height="400" fill="url(#glowL)"/>
    <rect width="1280" height="400" fill="url(#glowR)"/>
    <rect x="1" y="1" width="1278" height="398" rx="25" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>

    <!-- left: text block -->
    <circle class="pulse" cx="76" cy="92" r="5" fill="#67e8f9"/>
    <text class="sans" x="94" y="98" font-size="15" font-weight="700" letter-spacing="4" fill="#67e8f9">GITHUB  →  GITLAB</text>

    <text class="sans" x="68" y="206" font-size="96" font-weight="800" letter-spacing="-3" fill="url(#title)">mirror-hub</text>

    <text class="sans" x="72" y="258" font-size="27" font-weight="400" fill="#c7cff0">Your repos, mirrored on your schedule.</text>
    <text class="sans" x="72" y="292" font-size="19" font-weight="400" fill="#8d97c9">Tick the ones you want. New repos arrive as a pull request.</text>

    <g class="mono" font-size="15" font-weight="600" text-anchor="middle">
      <rect x="72" y="320" width="176" height="36" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#67e8f9" stroke-opacity="0.45"/>
      <text x="160" y="343" fill="#a5f3fc">repos.md ☑</text>
      <rect x="260" y="320" width="164" height="36" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#a78bfa" stroke-opacity="0.5"/>
      <text x="342" y="343" fill="#ddd6fe">timeloop.json</text>
      <rect x="436" y="320" width="176" height="36" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#fdba74" stroke-opacity="0.5"/>
      <text x="524" y="343" fill="#fed7aa">GitHub Actions</text>
    </g>

    <!-- right: mirror illustration -->
    <text class="sans" x="838" y="76" font-size="14" font-weight="700" letter-spacing="3" text-anchor="middle" fill="#67e8f9">GITHUB</text>
    <text class="sans" x="1082" y="76" font-size="14" font-weight="700" letter-spacing="3" text-anchor="middle" fill="#fdba74">GITLAB</text>

    <!-- mirror glass -->
    <rect x="950" y="52" width="20" height="262" rx="10" fill="#a78bfa" fill-opacity="0.35" filter="url(#soft)"/>
    <rect x="950" y="52" width="20" height="262" rx="10" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.45"/>
    <g clip-path="url(#mirrorClip)">
      <rect class="sweep" x="950" y="52" width="20" height="120" fill="url(#sweep)"/>
    </g>

    <!-- row 1: selected -->
    <rect x="758" y="100" width="170" height="54" rx="12" fill="url(#cardL)" stroke="#22d3ee" stroke-opacity="0.7"/>
    <text class="mono" x="778" y="133" font-size="17" font-weight="600" fill="#cffafe">[x] api</text>
    <rect x="992" y="100" width="170" height="54" rx="12" fill="url(#cardR)" stroke="#fb923c" stroke-opacity="0.7"/>
    <text class="mono" x="1012" y="133" font-size="17" font-weight="600" fill="#ffedd5">[x] api</text>

    <!-- row 2: selected -->
    <rect x="758" y="176" width="170" height="54" rx="12" fill="url(#cardL)" stroke="#22d3ee" stroke-opacity="0.7"/>
    <text class="mono" x="778" y="209" font-size="17" font-weight="600" fill="#cffafe">[x] website</text>
    <rect x="992" y="176" width="170" height="54" rx="12" fill="url(#cardR)" stroke="#fb923c" stroke-opacity="0.7"/>
    <text class="mono" x="1012" y="209" font-size="17" font-weight="600" fill="#ffedd5">[x] website</text>

    <!-- row 3: not selected -->
    <rect x="758" y="252" width="170" height="54" rx="12" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.22" stroke-dasharray="5 5"/>
    <text class="mono" x="778" y="285" font-size="17" fill="#7f89b8">[ ] old-test</text>
    <rect x="992" y="252" width="170" height="54" rx="12" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-dasharray="3 7"/>
    <text class="sans" x="1077" y="284" font-size="14" font-style="italic" text-anchor="middle" fill="#6b75a6">not selected</text>

    <!-- flow dots crossing the mirror -->
    <circle r="4.5" fill="#ffffff">
      <animateMotion dur="2.4s" repeatCount="indefinite" path="M930,127 L990,127"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="4.5" fill="#ffffff">
      <animateMotion dur="2.4s" begin="0.8s" repeatCount="indefinite" path="M930,203 L990,203"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
    </circle>

    <!-- caption -->
    <text class="sans" x="960" y="344" font-size="13" letter-spacing="2" text-anchor="middle" fill="#8d97c9">GitLab always equals GitHub</text>
  </g>
</svg>
