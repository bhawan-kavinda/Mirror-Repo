<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="bt bd" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="bt">mirror-hub</title>
  <desc id="bd">Automatic GitHub to GitLab mirroring, driven by webhooks, a Cloudflare Worker and GitHub Actions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0e1f"/>
      <stop offset="0.6" stop-color="#161a38"/>
      <stop offset="1" stop-color="#241a3a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9afff"/>
      <stop offset="1" stop-color="#ffb27a"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7cff"/>
      <stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
    <linearGradient id="mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <radialGradient id="glowL" cx="0.15" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8b7cff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8b7cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.9" cy="0.5" r="0.4">
      <stop offset="0" stop-color="#ff8a3d" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#dots)"/>
  <rect width="1280" height="400" rx="24" fill="url(#glowL)"/>
  <rect width="1280" height="400" rx="24" fill="url(#glowR)"/>
  <rect x="2" y="2" width="1276" height="396" rx="23" fill="none" stroke="url(#rim)" stroke-opacity="0.45" stroke-width="2"/>

  <!-- icon -->
  <g transform="translate(80 92) scale(0.86)">
    <rect x="8" y="8" width="240" height="240" rx="56" fill="#0b0e1f" fill-opacity="0.85"/>
    <rect x="8" y="8" width="240" height="240" rx="56" fill="none" stroke="url(#rim)" stroke-width="4"/>
    <rect x="126" y="36" width="4" height="184" rx="2" fill="url(#mid)"/>
    <g stroke="#8b7cff" stroke-width="7" stroke-linecap="round" fill="none">
      <path d="M88 64 V192"/>
      <path d="M88 104 C88 130 56 122 56 148"/>
    </g>
    <g fill="#0b0e1f" stroke="#8b7cff" stroke-width="7">
      <circle cx="88" cy="64" r="12"/>
      <circle cx="88" cy="128" r="12"/>
      <circle cx="88" cy="192" r="12"/>
      <circle cx="56" cy="148" r="10"/>
    </g>
    <g stroke="#ff8a3d" stroke-width="7" stroke-linecap="round" fill="none">
      <path d="M168 64 V192"/>
      <path d="M168 104 C168 130 200 122 200 148"/>
    </g>
    <g fill="#0b0e1f" stroke="#ff8a3d" stroke-width="7">
      <circle cx="168" cy="64" r="12"/>
      <circle cx="168" cy="128" r="12"/>
      <circle cx="168" cy="192" r="12"/>
      <circle cx="200" cy="148" r="10"/>
    </g>
  </g>

  <!-- text -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="340" y="196" font-size="88" font-weight="800" letter-spacing="-2" fill="url(#title)">mirror-hub</text>
    <text x="344" y="248" font-size="30" font-weight="500" fill="#d7dcf5">Automatic GitHub → GitLab mirroring</text>
    <text x="344" y="290" font-size="20" fill="#8b93b8">Webhook-driven · Cloudflare Worker · GitHub Actions · zero servers</text>
  </g>

  <!-- decorative mirrored graph (right) -->
  <g opacity="0.55">
    <rect x="1139" y="60" width="3" height="280" rx="1.5" fill="url(#mid)"/>
    <g stroke="#8b7cff" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M1100 80 V320"/>
      <path d="M1100 160 C1100 185 1072 180 1072 205"/>
    </g>
    <g fill="#0b0e1f" stroke="#8b7cff" stroke-width="4">
      <circle cx="1100" cy="80" r="8"/>
      <circle cx="1100" cy="160" r="8"/>
      <circle cx="1100" cy="240" r="8"/>
      <circle cx="1100" cy="320" r="8"/>
      <circle cx="1072" cy="205" r="7"/>
    </g>
    <g stroke="#ff8a3d" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M1180 80 V320"/>
      <path d="M1180 160 C1180 185 1208 180 1208 205"/>
    </g>
    <g fill="#0b0e1f" stroke="#ff8a3d" stroke-width="4">
      <circle cx="1180" cy="80" r="8"/>
      <circle cx="1180" cy="160" r="8"/>
      <circle cx="1180" cy="240" r="8"/>
      <circle cx="1180" cy="320" r="8"/>
      <circle cx="1208" cy="205" r="7"/>
    </g>
    <!-- sync pulses -->
    <g stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 8" fill="none">
      <path d="M1108 160 H1172">
        <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.6s" repeatCount="indefinite"/>
      </path>
      <path d="M1108 240 H1172">
        <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.6s" begin="0.5s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>
</svg>
